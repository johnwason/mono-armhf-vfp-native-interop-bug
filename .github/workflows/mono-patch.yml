# Verifies the fix in patches/mono-arm-throw-fp-regs-offset.patch. No ARM
# hardware is needed:
#
#   1. cross-compiles Debian sid's mono runtime (mono-sgen) for armhf on x86-64,
#      once unmodified and once with the patch;
#   2. runs the reproducer with each in a Debian sid armhf container with
#      podman + qemu-user, using the sid mono-runtime package's class libraries.
#
# The job passes only if the unpatched runtime shows the corruption (exit 1)
# and the patched runtime does not (exit 0).

name: armhf mono patch verification

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      iterations:
        description: Callback invocations per row
        default: "2000"

permissions:
  contents: read

# An explicit `shell: bash` runs steps with -eo pipefail, so the reproducer's
# exit code survives `| tee` (the implicit default is plain `bash -e`).
defaults:
  run:
    shell: bash

jobs:
  verify:
    name: Cross-compiled mono on Debian sid (armhf, qemu), unpatched vs patched
    runs-on: ubuntu-24.04
    env:
      ITERATIONS: ${{ inputs.iterations || '2000' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install armhf cross toolchain, mcs and qemu-user
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-arm-linux-gnueabihf binutils-arm-linux-gnueabihf libc6-dev-armhf-cross mono-mcs \
            qemu-user-static
          if [ ! -e /proc/sys/fs/binfmt_misc/qemu-arm ]; then
            sudo systemctl restart systemd-binfmt
          fi
          cat /proc/sys/fs/binfmt_misc/qemu-arm
          podman --version

      # scripts/build.sh also builds the .NET 10 control, so it needs the SDK
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build reproducer
        run: ./scripts/build.sh

      - name: Cross-compile mono runtime for armhf (unpatched and patched)
        run: ./scripts/build-mono-armhf.sh sid 2>&1 | tee mono-build.log

      - name: Pull armhf image
        run: podman pull --platform linux/arm/v7 docker.io/library/debian:sid

      - name: Run reproducer with unpatched mono (expect corruption)
        run: |
          set +e
          ./scripts/run-armhf.sh sid mono-unpatched "$ITERATIONS" 2>&1 | tee unpatched.log
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -ne 1 ]; then
            echo "::error::expected the unpatched runtime to show the corruption (exit 1), got exit $rc"
            exit 1
          fi
          echo "unpatched runtime corrupts d8-d15, as expected"

      - name: Run reproducer with patched mono (expect pass)
        run: ./scripts/run-armhf.sh sid mono-patched "$ITERATIONS" 2>&1 | tee patched.log

      - name: Job summary
        if: always()
        run: |
          {
            echo "### Cross-compiled mono $(cat build/mono-xbuild/VERSION 2>/dev/null) on Debian sid (armhf under qemu)"
            for v in unpatched patched; do
              echo
              echo "#### $v"
              echo
              echo '```'
              grep -E '^(Runtime|package):' $v.log || true
              sed -n '/^Exact probe/,$p' $v.log || true
              echo '```'
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mono-patch-verification
          path: |
            mono-build.log
            unpatched.log
            patched.log
            patches/mono-arm-throw-fp-regs-offset.patch
            build/mono-xbuild/VERSION
            build/mono-xbuild/unpatched/mono-sgen
            build/mono-xbuild/patched/mono-sgen
